<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Parcel Delivery Tracking System</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Parcel Delivery Tracking</h1>
    <nav>
      <button id="nav-dashboard">Dashboard</button>
      <button id="nav-register">Register Parcel</button>
      <button id="nav-track">Track</button>
      <button id="nav-manage">Manage</button>
      <button id="nav-cost">Cost Calculator</button>
    </nav>
  </header>
  <main>
    <section id="dashboard" class="view">
      <h2>Dashboard</h2>
      <div id="stats">
        <div class="card"><h3>Total Parcels</h3><p id="total-parcels">0</p></div>
        <div class="card"><h3>Average Weight (kg)</h3><p id="avg-weight">0</p></div>
        <div class="card"><h3>By Status</h3><pre id="by-status">{}</pre></div>
      </div>
    </section>

    <section id="register" class="view hidden">
      <h2>Register Parcel</h2>
      <form id="register-form">
        <label>Sender Name<input name="sender_name" required></label>
        <label>Receiver Name<input name="receiver_name" required></label>
        <label>Origin<input name="origin"></label>
        <label>Destination<input name="destination" required></label>
        <label>Weight (kg)<input name="weight_kg" type="number" step="0.01" required></label>
        <button type="submit">Register</button>
      </form>
      <div id="register-result"></div>
    </section>

    <section id="track" class="view hidden">
      <h2>Track Parcel</h2>
      <form id="track-form">
        <label>Tracking Number<input name="tracking" required></label>
        <button type="submit">Lookup</button>
      </form>
      <pre id="track-result"></pre>
    </section>

    <section id="manage" class="view hidden">
      <h2>Manage Parcels</h2>
      <table id="parcels-table">
        <thead><tr><th>Tracking</th><th>Sender</th><th>Receiver</th><th>Destination</th><th>Weight</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <section id="cost" class="view hidden">
      <h2>Cost Calculator</h2>
      <form id="cost-form">
        <label>Weight (kg)<input name="weight_kg" type="number" step="0.01" required></label>
        <label>Distance (km)<input name="distance_km" type="number" step="0.1" required></label>
        <label>Speed<select name="speed"><option value="standard">Standard</option><option value="express">Express</option><option value="overnight">Overnight</option></select></label>
        <button type="submit">Calculate</button>
      </form>
      <div id="cost-result"></div>
    </section>

  </main>
  <script src="app.js"></script>
</body>
</html>
